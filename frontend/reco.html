<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comparer</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
	<div id="nav"></div>

	<main class="container p-4 my-4 py-5">
		<h1 class="h2 mb-4">Comparer les recommandations</h1>
		<div id="erreur"></div>

		<div class="row g-2 mb-4">
			<div class="col-md-4">
				<input id="recherche" type="search" class="form-control" placeholder="Rechercher un animé...">
			</div>
			<div class="col-md-6">
				<select id="contenu" class="form-select"></select>
			</div>
			<div class="col-md-2">
				<button id="comparer" class="btn btn-primary w-100">Comparer</button>
			</div>
		</div>

		<div id="fiche" class="mb-4"></div>

		<div class="row g-3">
			<div class="col-md-6">
				<div class="card border-0 shadow-sm h-100">
					<div class="card-body">
						<h2 class="h5 mb-3">Méthode 1 : contenu <span id="temps-contenu"
								class="badge text-bg-primary"></span></h2>
						<div id="resultats-contenu"></div>
					</div>
				</div>
			</div>
			<div class="col-md-6">
				<div class="card border-0 shadow-sm h-100">
					<div class="card-body">
						<h2 class="h5 mb-3">Méthode 2 : embeddings <span id="temps-embeddings"
								class="badge text-bg-primary"></span></h2>
						<div id="resultats-embeddings"></div>
					</div>
				</div>
			</div>
		</div>

		<h2 class="h5 mt-5 mb-3">Temps de réponse sur la session</h2>
		<div class="table-responsive">
			<table class="table">
				<thead>
					<tr>
						<th>Méthode</th>
						<th>Dernier (ms)</th>
						<th>Min (ms)</th>
						<th>Max (ms)</th>
						<th>Moyenne (ms)</th>
						<th>Comparaisons</th>
					</tr>
				</thead>
				<tbody id="dashboard"></tbody>
			</table>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<script src="js/nav.js"></script>
	<script src="js/api.js"></script>
	<script src="js/reco.js"></script>
</body>

</html>
